<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr Robot Volkov</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --mute: #57534e;
      --paper: #f5f0e8;
      --card: #fffcf7;
      --line: #d6cfc4;
      --accent: #b45309;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      width: min(28rem, 100%);
      padding: 2.25rem 2rem 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 8px 8px 0 color-mix(in srgb, var(--ink) 8%, transparent);
    }

    p.kicker {
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.15rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    p.about {
      margin-top: 0.85rem;
      color: var(--mute);
      font-size: 1.05rem;
      line-height: 1.45;
    }

    ul {
      list-style: none;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.25rem;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 0.05em;
    }

    a:hover,
    a:focus-visible {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">визитка</p>
    <h1>Алекс Волков</h1>
    <p class="about">Верстаю простые страницы и разбираюсь, как устроен веб.</p>
    <ul>
      <li><a href="v.3d@gmail.com">почта</a></li>
      <li><a href="https://t.me/volkkkqwert">telegram</a></li>
      <li><a href="https://github.com/qwerybolk">github</a></li>
    </ul>
  </main>
</body>
</html>
