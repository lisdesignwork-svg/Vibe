<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Марк Ворон</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d10;
      --card: #14161c;
      --text: #e8e6e1;
      --mute: #9a958c;
      --line: #2a2d36;
      --accent: #c8f06a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #1a1e14 0%, var(--bg) 55%);
      color: var(--text);
    }

    main {
      width: min(26rem, 100%);
      padding: 2.4rem 2rem 2rem 2.15rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
    }

    p.kicker {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.1rem, 7vw, 2.7rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    p.about {
      margin-top: 1rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--mute);
      font-size: 1rem;
      line-height: 1.55;
    }

    ul {
      list-style: none;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    a {
      color: var(--text);
      text-decoration: none;
      width: fit-content;
    }

    a:hover,
    a:focus-visible {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">визитка</p>
    <h1>Марк Ворон</h1>
    <p class="about">Делаю тёмные страницы и короткие тексты. Люблю, когда интерфейс молчит, а смысл остаётся.</p>
    <ul>
      <li><a href="mailto:v.3d@gmail.com">почта</a></li>
      <li><a href="https://t.me/volkkkqwert">telegram</a></li>
      <li><a href="https://github.com/qwerybolk">github</a></li>
    </ul>
  </main>
</body>
</html>
